/* ---------- data helpers ---------- */

const md=id=>D.m[id];

const orderAt=g=>[...MG()].sort((a,b)=>md(b.id).tot[g-1]-md(a.id).tot[g-1]);
const posAt=(g,id)=>orderAt(g).findIndex(m=>m.id==id)+1;
const tieLab=(arr,v,k)=>{const x=v(arr[k]),r=arr.findIndex(y=>v(y)===x)+1,n=arr.filter(y=>v(y)===x).length;return n>1?r+'=':String(r);};
const tieTop=(arr,v,k)=>v(arr[k])===v(arr[0]);
const capPts=(id,g)=>{const d=md(id).d[g-1];const mult=d.chip==='3xc'?3:2;return (d.cap[2]?d.cap[1]:d.vc[1])*mult;};
const hasFinal=g=>g<=D.current;
const hasPrev=g=>!!(D.gw[g]&&D.gw[g].preview);
const maxGw=()=>Math.max(D.current,D.next?D.next.gw:0);
const chipsLeft=(id,g)=>{const h=g<=19?[1,19]:[20,38];const used=md(id).chips.filter(c=>c[1]>=h[0]&&c[1]<=Math.min(g,h[1])).map(c=>c[0]);const left=Object.keys(CHIP).filter(c=>!used.includes(c)).map(c=>CHIP[c]);return left.length?left.join(', '):'אין';};

/* ---------- automatic text for a closing edition ---------- */
function autoFinal(g){
  const i=g-1, ms=MG(), pts=ms.map(m=>md(m.id).pts[i]), mx=Math.max(...pts), mn=Math.min(...pts);
  const K=ms.filter(m=>md(m.id).pts[i]==mx), F=ms.filter(m=>md(m.id).pts[i]==mn), o=orderAt(g), lead=o[0], sec=o[1];
  const gap=md(lead.id).tot[i]-md(sec.id).tot[i], prevLead=g>1?orderAt(g-1)[0]:null;
  const lavg=(sum(pts)/ms.length).toFixed(1), gavg=D.glob.avg[i];
  let headline=gap===0?`תיקו בפסגה בין ${lead.he} ל${sec.he}`:g===1?`${lead.he} פותח את העונה בראש`:prevLead&&prevLead.id!==lead.id?`${lead.he} עולה לפסגה`:gap===0?`תיקו בפסגה בין ${lead.he} ל${sec.he}`:gap<=10?`${sec.he} נושף בעורף: ${gap} נקודות מהפסגה`:`${lead.he} מוביל ב-${gap}`;
  const dek=`${K.map(m=>m.he).join(' ו')} ${K.length>1?'חלקו את':''} מלך המחזור עם ${mx}, ${F.map(m=>m.he).join(' ו')} בתחתית עם ${mn}. ממוצע הליגה ${lavg} מול ${gavg} בעולם.`;
  const kd=md(K[0].id).d[i], fd=md(F[0].id).d[i];
  const king=`השחקן הכי טוב שלו היה ${kd.top[0]} עם ${kd.top[1]}, והקפטן ${kd.cap[0]} עשה ${kd.cap[1]}.${kd.chip?` את המחזור הוא שיחק עם ${CHIP[kd.chip]}.`:''}`;
  const flop=`הקפטן ${fd.cap[0]} עשה ${fd.cap[1]}.${md(F[0].id).bench[i]>=8?` ועוד ${md(F[0].id).bench[i]} נקודות נשארו על הספסל.`:''}`;
  const J=[];
  const cc={};ms.forEach(m=>{const c=md(m.id).d[i].cap[0];(cc[c]=cc[c]||[]).push(m);});
  const top=Object.entries(cc).sort((a,b)=>b[1].length-a[1].length)[0];
  if(top[1].length>=3){const cp=md(top[1][0].id).d[i].cap[1];const others=ms.filter(m=>!top[1].includes(m)).map(m=>`${m.he} עם ${md(m.id).d[i].cap[0]} (${md(m.id).d[i].cap[1]})`);
    J.push([`${top[0]}: ${cp}`,top[1].length===ms.length?'כולם':`${top[1].length} מכם`,`${top[1].length} מתוך ${ms.length} שמו את הסרט על ${top[0]}, שעשה ${cp}.${others.length?' הלכו על משהו אחר: '+others.join(', ')+'.':''}`]);}
  const bm=[...ms].sort((a,b)=>md(b.id).bench[i]-md(a.id).bench[i])[0], bv=md(bm.id).bench[i], bb=md(bm.id).d[i].bb;
  if(bv>=8)J.push([`${bv} נקודות על הספסל`,bm.he,`${bm.he} השאיר ${bv} נקודות בחוץ${bb?`, כולל ${bb[0]} שעשה ${bb[1]}`:''}.`]);
  const cm=[...ms].sort((a,b)=>md(b.id).cr[i]-md(a.id).cr[i])[0], cd=md(cm.id).d[i];
  if(md(cm.id).cr[i]>=8)J.push([`הסרט על ${cd.cap[0]}, הנקודות אצל ${cd.top[0]}`,cm.he,`${cm.he} שם קפטן על ${cd.cap[0]} (${cd.cap[1]}). השחקן הכי טוב שלו, ${cd.top[0]}, עשה ${cd.top[1]}. ${md(cm.id).cr[i]} נקודות הלכו לפח.`]);
  const trs=[];ms.forEach(m=>{const d=md(m.id).d[i];if(d.chip==='freehit'||d.chip==='wildcard')return;d.tr.forEach(t=>trs.push([m,t,t[1]-t[3]]));});
  trs.sort((a,b)=>b[2]-a[2]);
  if(trs.length&&trs[0][2]>=3){const [m,t,v]=trs[0];J.push(['ההעברה של המחזור',m.he,`${t[0]} (${t[1]}) נכנס במקום ${t[2]} (${t[3]}): ${sgt(v)} כבר בשבוע הראשון.`]);}
  if(trs.length&&trs[trs.length-1][2]<=-3){const [m,t,v]=trs[trs.length-1];J.push(['ההעברה שכדאי לשכוח',m.he,`${t[0]} (${t[1]}) נכנס, ${t[2]} שיצא עשה ${t[3]}. ${sgt(v)} בשבוע הראשון.`]);}
  ms.forEach(m=>{const d=md(m.id).d[i];if(d.chip)J.push([`${CHIP[d.chip]} של ${m.he}`,m.he,`${m.he} הפעיל ${CHIP[d.chip]} ועשה ${md(m.id).pts[i]}, ${md(m.id).pts[i]>=lavg?'מעל':'מתחת ל'}ממוצע הליגה (${lavg}).`]);});
  if(g>1){const mv=ms.map(m=>[m,posAt(g-1,m.id)-posAt(g,m.id)]).sort((a,b)=>b[1]-a[1]);
    if(mv[0][1]>=2)J.push([`${mv[0][0].he} עולה ${mv[0][1]} מקומות`,mv[0][0].he,`ממקום ${posAt(g-1,mv[0][0].id)} למקום ${posAt(g,mv[0][0].id)} בשבוע אחד.`]);
    const l=mv[mv.length-1];if(l[1]<=-2)J.push([`${l[0].he} נופל ${-l[1]} מקומות`,l[0].he,`ממקום ${posAt(g-1,l[0].id)} למקום ${posAt(g,l[0].id)}.`]);
    if(mv.every(x=>x[1]===0))J.push(['המחזור שבו כלום לא זז','כולם','אף אחד בליגה לא זז אפילו מקום אחד.']);}
  ms.forEach(m=>{if(md(m.id).lr[i]===0)J.push([`השבוע המושלם של ${m.he}`,m.he,`${md(m.id).pts[i]} נקודות, ואפס על השולחן: המקסימום שהסגל שלו יכול היה לעשות.`]);});
  ms.forEach(m=>{const h=md(m.id).hits[i];if(h>0)J.push([`${m.he} שילם ‎−${h}`,m.he,`${md(m.id).tc[i]} חילופים, ומינוס ${h} על החשבון.`]);});
  const wk=[...ms].sort((a,b)=>md(b.id).lr[i]-md(a.id).lr[i]), w0=wk[0];
  const st=[[`${w0.he}: ${md(w0.id).lr[i]} נקודות בחוץ`,`עם ההרכב הנכון מתוך 15 השחקנים שלו, ${w0.he} היה עושה ${md(w0.id).pts[i]+md(w0.id).lr[i]} במקום ${md(w0.id).pts[i]}.`]];
  const seas=ms.map(m=>[m,sum(md(m.id).lr.slice(0,g))]).sort((a,b)=>b[1]-a[1]);
  st.push([`השולחן הכי מלא: ${seas[0][0].he}`,`${seas[0][1]} נקודות נשארו בחוץ אצל ${seas[0][0].he} עד עכשיו, הכי הרבה בליגה. הכי מעט: ${seas[seas.length-1][0].he}, עם ${seas[seas.length-1][1]}.`]);
  const lines={};ms.forEach(m=>{const d=md(m.id).d[i];lines[m.id]=`מקום ${posAt(g,m.id)} עם ${md(m.id).tot[i]}. השבוע ${md(m.id).pts[i]}, קפטן ${d.cap[0]} (${d.cap[1]}), הכי טוב ${d.top[0]} (${d.top[1]}).`;});
  return {headline,dek,king,flop,jabs:J.slice(0,9),stories:st,lines,awards:autoAwards(g)};
}
function autoAwards(g){
  const ms=MG(),A=[],best=(f,dir=1)=>[...ms].map(m=>[m,f(m.id)]).sort((a,b)=>dir*(b[1]-a[1]))[0];
  let c=best(id=>sum(Array.from({length:g},(_,k)=>capPts(id,k+1))));A.push(['הקפטן של העונה',c[0].he,String(c[1]),`${c[1]} נקודות מהקפטן עד עכשיו, הכי הרבה בליגה.`]);
  c=best(id=>new Set(md(id).d.slice(0,g).map(d=>d.cap[0])).size);A.push(['הקפטן הנודד',c[0].he,String(c[1]),`${c[1]} קפטנים שונים ב-${g} מחזורים.`]);
  c=best(id=>sum(md(id).bench.slice(0,g)));A.push(['מלך הספסל',c[0].he,String(c[1]),`${c[1]} נקודות נשארו על הספסל שלו.`]);
  c=best(id=>sum(md(id).lr.slice(0,g)));A.push(['השולחן הכי מלא',c[0].he,String(c[1]),`${c[1]} נקודות נשארו בחוץ לעומת ההרכב המושלם.`]);
  const kc={},fc={};ms.forEach(m=>{kc[m.id]=0;fc[m.id]=0;});
  for(let k=0;k<g;k++){const p=ms.map(m=>md(m.id).pts[k]),mx=Math.max(...p),mn=Math.min(...p);ms.forEach(m=>{if(md(m.id).pts[k]==mx)kc[m.id]++;if(md(m.id).pts[k]==mn)fc[m.id]++;});}
  c=best(id=>kc[id]);A.push(['אספן הכתרים',c[0].he,String(c[1]),`מלך המחזור ${c[1]} פעמים.`]);
  c=best(id=>fc[id]);A.push(['מנוי לתחתית',c[0].he,String(c[1]),`בתחתית המחזור ${c[1]} פעמים.`]);
  c=best(id=>md(id).bank[g-1]);A.push(['הבנקאי',c[0].he,'£'+(c[1]/10).toFixed(1)+'m',`${(c[1]/10).toFixed(1)} מיליון פנויים בבנק, הכי הרבה בליגה.`]);
  c=best(id=>md(id).val[g-1]);A.push(['הקבוצה הכי יקרה',c[0].he,'£'+(c[1]/10).toFixed(1)+'m',`הסגל שלו שווה ${(c[1]/10).toFixed(1)} מיליון.`]);
  return A;
}

const h2hAt=g=>{const ms=MG(),r={};ms.forEach(a=>{r[a.id]={};ms.forEach(b=>{if(a.id===b.id)return;let w=0,l=0,t=0;for(let k=0;k<g;k++){const x=md(a.id).pts[k]-md(a.id).hits[k],y=md(b.id).pts[k]-md(b.id).hits[k];if(x>y)w++;else if(x<y)l++;else t++;}r[a.id][b.id]=[w,l,t];});});return r;};

/* ---------- title odds (simulation) ---------- */
const OC={};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
function oddsSkill(g){
  const ms=MG(),A=D.archive||{},ex=A.exclude||[],CH=['bboost','3xc','freehit'];
  const net=(id,k)=>md(id).pts[k]-md(id).hits[k];
  const lm=Array.from({length:g},(_,k)=>ms.reduce((s,m)=>s+net(m.id,k),0)/ms.length);
  const res=ms.map(m=>{const r=[];for(let k=0;k<g;k++){const c=md(m.id).d[k]&&md(m.id).d[k].chip;if(!CH.includes(c))r.push(net(m.id,k)-lm[k]);}return r;});
  const cur=res.map(r=>r.length?r.reduce((a,b)=>a+b,0)/r.length:0);
  let ss=0,df=0;res.forEach((r,j)=>{r.forEach(x=>{ss+=(x-cur[j])**2;});df+=Math.max(0,r.length-1);});
  const sig=Math.max(9,df>4?Math.sqrt(ss/df):12);
  const S={};ms.forEach(m=>md(m.id).past.forEach(p=>{if(!ex.includes(p[0]))(S[p[0]]=S[p[0]]||{})[m.id]=p[1];}));
  const prior=ms.map(m=>{const v=Object.values(S).filter(o=>o[m.id]!=null&&Object.keys(o).length>=3).map(o=>{const vs=Object.values(o);return (o[m.id]-vs.reduce((a,b)=>a+b,0)/vs.length)/38;});return v.length?0.5*v.reduce((a,b)=>a+b,0)/v.length:0;});
  const N0=20;
  return ms.map((m,j)=>{const n=res[j].length;return {m,cur:cur[j],prior:prior[j],mu:(n*cur[j]+N0*prior[j])/(n+N0),tau:sig/Math.sqrt(n+N0),sig,n};});
}
function oddsSim(g,{N=20000,extra=null,skip=0}={}){
  const ms=MG(),n=ms.length,R=38-g-skip,K=oddsSkill(g);
  const base=ms.map((m,j)=>md(m.id).tot[g-1]+skip*K[j].mu+(extra?extra[j]:0)),win=new Array(n).fill(0),last=new Array(n).fill(0),r=rng(7919+g),tot=new Array(n);
  const gs=()=>{let u=r()||1e-9,v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v);};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const benM=ms.map(m=>{const b=md(m.id).bench.slice(0,g).filter((x,k)=>md(m.id).d[k].chip!=='bboost');return b.length?avg(b):8;});
  const capM=ms.map(m=>{const c=Array.from({length:g},(_,k)=>capPts(m.id,k+1)/(md(m.id).d[k].chip==='3xc'?3:2));return c.length?avg(c):7;});
  const left=(id,c)=>(g<19&&!usedChip(id,c,g)?1:0)+(g<20?1:(!usedChip(id,c,g)?1:0));
  const nB=ms.map(m=>left(m.id,'bboost')),nT=ms.map(m=>left(m.id,'3xc')),sq=Math.sqrt(Math.max(0,R));
  for(let it=0;it<N;it++){
    for(let j=0;j<n;j++){const k=K[j];let v=base[j]+R*(k.mu+k.tau*gs())+k.sig*sq*gs();for(let q=0;q<nB[j];q++)v+=Math.max(0,benM[j]+4*gs());for(let q=0;q<nT[j];q++)v+=Math.max(0,capM[j]+5*gs());tot[j]=v;}
    let mx=-1e9,mn=1e9,jx=0,jn=0;for(let j=0;j<n;j++){if(tot[j]>mx){mx=tot[j];jx=j;}if(tot[j]<mn){mn=tot[j];jn=j;}}
    win[jx]++;last[jn]++;
  }

/* ---------- fixture planner ---------- */
const hasFx=()=>!!(D.fixtures&&Object.keys(D.fixtures).length);
const fxGws=()=>{const s=new Set();Object.values(D.fixtures||{}).forEach(a=>a.forEach(f=>s.add(f[0])));return [...s].sort((a,b)=>a-b);};
const fxOf=t=>{const o={};fxGws().forEach(g=>o[g]=[]);(D.fixtures[t]||[]).forEach(f=>(o[f[0]]=o[f[0]]||[]).push(f));return o;};
const fxAvg=t=>{const a=(D.fixtures[t]||[]).map(f=>f[3]);const blanks=fxGws().filter(g=>!(D.fixtures[t]||[]).some(f=>f[0]===g)).length;const v=[...a,...Array(blanks).fill(5)];return v.length?sum(v)/v.length:3;};
const f2=v=>(Math.round(v*10)/10).toFixed(1),f3=v=>(Math.round(v*100)/100).toFixed(2);
function fxSquadGw(){let g=0;for(let k=1;k<=maxGw();k++)if(D.gw[k]&&D.gw[k].preview&&D.gw[k].preview.eo)g=k;return g;}
function fxSquad(id){const g=fxSquadGw();if(!g)return [];
  return D.gw[g].preview.eo.filter(r=>r[6][id]!=null).map(r=>({name:r[0],team:r[1],pos:r[3],mult:r[6][id],nst:Object.values(r[6]).filter(v=>v>0).length,ncap:Object.values(r[6]).filter(v=>v>=2).length})).sort((a,b)=>(b.mult>0)-(a.mult>0)||a.pos-b.pos);}
function fxCell(fs){if(!fs||!fs.length)return '<td class="fd f0"><b>—</b><small>אין</small></td>';
  return `<td class="fd f${Math.max(...fs.map(f=>f[3]))}">${fs.map(f=>`<b>${esc(f[1])}</b><small>(${f[2]==='H'?'H':'A'})</small>`).join('')}</td>`;}
function fxGrid(rows,lab){const G=fxGws();
  return `<table class="fxg"><thead><tr><th>${esc(lab)}</th>${G.map(g=>`<th>${g}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr${r.bench?' class="bn"':''}><th>${r.h}</th>${G.map(g=>fxCell(fxOf(r.team)[g])).join('')}</tr>`).join('')}</tbody></table>`;}
function fxModel(){const G=fxGws(),ms=MG();
  const coach=ms.map(m=>{const sq=fxSquad(m.id),xi=sq.filter(p=>p.mult>0);
    const per=G.map(g=>{const v=[];xi.forEach(p=>{const fs=fxOf(p.team)[g];if(!fs.length)v.push(5);else fs.forEach(f=>v.push(f[3]));});return v.length?sum(v)/v.length:3;});
    const all=[];xi.forEach(p=>G.forEach(g=>{const fs=fxOf(p.team)[g];if(!fs.length)all.push(5);else fs.forEach(f=>all.push(f[3]));}));
    const pl=xi.map(p=>({...p,a:fxAvg(p.team)})).filter(p=>p.nst<=3),worst=[...pl].sort((a,b)=>b.a-a.a||a.nst-b.nst)[0],best=[...pl].sort((a,b)=>a.a-b.a||a.nst-b.nst)[0];
    const cap=xi.find(p=>p.mult>=2);
    return {m,sq,xi,per,avg:all.length?sum(all)/all.length:3,easy:all.filter(v=>v<=2).length,hard:all.filter(v=>v>=4).length,worst,best,cap};}).sort((a,b)=>a.avg-b.avg);
  const own={};ms.forEach(m=>fxSquad(m.id).forEach(p=>{(own[p.team]=own[p.team]||new Set()).add(m.he);}));
  const teams=Object.keys(D.fixtures).map(t=>({t,a:fxAvg(t),own:own[t]?[...own[t]]:[]})).sort((a,b)=>a.a-b.a);

function pmFx(team,g){const F=(D.fixtures&&D.fixtures[team])||[];const fs=F.filter(f=>f[0]===g).map(f=>[f[1],f[2]==='H']);const gs=F.map(f=>f[0]);if(fs.length||(gs.length&&g>=Math.min(...gs)&&g<=Math.max(...gs)))return fs;const K=D.gw[g]&&D.gw[g].kick;if(K)return K.filter(k=>k[0]===team||k[1]===team).map(k=>k[0]===team?[k[1],true]:[k[0],false]);return null;}

}

function openFacts(g){

/* a short tick on Android when something happens (iPhone browsers do not support vibration) */
const buzz=(ms=10)=>{try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('.walink,[data-me],.isme,[data-recapply],[data-trtry],[data-txin],[data-txsw],[data-txact],[data-txchip],[data-txreset],[data-txu]'))buzz(10);},true);
document.getElementById('tabbar').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('aria-current')==='page'&&scrollY>40){e.preventDefault();scrollTo({top:0,behavior:'smooth'});}});
const footTxt=()=>{const v=D.builtAt||(D.planner&&D.planner.asOf)||D.updated,t=new Date(v);const w=isNaN(t)?v:D.builtAt?t.toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}):t.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'});
  $('foot').textContent=`ליגת Psychopaths · ${D.managers.length} מאמנים · הנתונים מ-FPL, מתעדכנים לבד · עודכן ${w}`;};
const gwOpts=()=>{$('gwsel').innerHTML=Array.from({length:maxGw()},(_,k)=>`<option value="${k+1}">מחזור ${k+1}</option>`).join('');};
let loadedAt=0;
loadData().then(d=>{D=d;S.gw=D.current;loadedAt=Date.now();gwOpts();footTxt();meMenu();if(standalone())$('inst2').hidden=true;route();}).catch(err=>{$('view').innerHTML='<section class="band"><div class="in"><p>לא הצלחתי לטעון את הנתונים. נסו לרענן.</p></div></section>';});
/* back to the app after a while (a phone tab, the home-screen app): if there is newer data, reload (the hash keeps the page, drafts are in localStorage) */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!D||Date.now()-loadedAt<5*6e4)return;loadedAt=Date.now();
  loadData().then(d=>{if(!d||d.builtAt===D.builtAt)return;const busy=$('ov').classList.contains('on')||document.body.classList.contains('sheet')||document.querySelector('.open,input:focus,textarea:focus');if(busy)return;location.reload();}).catch(()=>{});});
}
</script>
