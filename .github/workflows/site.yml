name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # every 30 minutes; quiet runs (no match in play, far from a deadline, built < 3h ago) exit in seconds
    - cron: '7,37 * * * *'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only for the keep-alive commit below
      pages: write
    outputs:
      deploy: ${{ steps.data.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build data.json from the FPL API
        id: data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ github.event_name != 'schedule' }}
        run: node update.mjs _site

      - name: Assemble the site
        if: steps.data.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp index.html manifest.webmanifest robots.txt sw.js _site/
          cp -r assets _site/
          sed -i "s#__SITE__#${SITE_URL%/}/#g" _site/index.html
          sed -i "s#__BUILD__#${GITHUB_SHA::8}#g" _site/sw.js

      - if: steps.data.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # GitHub turns off scheduled workflows after 60 days without a commit (the off-season)
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "psycho-fantasy-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep the schedule alive"
            git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
